<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>붕괴·화재 건물 10선 · 3D Scene Viewer</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#e6e7e8;background:#151a20}*{box-sizing:border-box}body{margin:0;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}.panel{position:fixed;background:rgba(24,30,36,.94);border:1px solid #41494e;border-radius:12px;box-shadow:0 12px 30px #0004;backdrop-filter:blur(10px)}#control{left:18px;top:18px;width:294px;padding:19px;max-height:calc(100vh - 80px);overflow:auto}h1{font-size:20px;margin:6px 0 9px;letter-spacing:-.6px}.eyebrow{font-size:10px;letter-spacing:2px;color:#eead72}.note{font-size:12px;color:#a9b3b9;line-height:1.65}select,button{font:inherit;color:inherit;background:#29323a;border:1px solid #4a555e;border-radius:6px;padding:9px;cursor:pointer}select{width:100%;margin:14px 0 9px;font-size:12px}button:hover{border-color:#e8af7c}#levels{display:flex;gap:5px;margin:12px 0}#levels button{flex:1;padding:8px 0;font-size:12px}button.active{background:#a65930;border-color:#e49b64}label{display:block;font-size:12px;padding:7px 0;color:#d4dadb;cursor:pointer}input{accent-color:#e89c60;margin-right:8px}hr{border:0;border-top:1px solid #3b4349;margin:12px 0}.stats{font-size:11px;color:#a5b0b7;line-height:1.9}#features{max-height:158px;overflow:auto}.feature{display:block;background:transparent;text-align:left;width:100%;padding:7px 4px;border:0;border-bottom:1px solid #354049;font-size:11px;color:#c7d0d5}.feature span{color:#e6a378;margin-right:8px}#bar{right:20px;top:20px;padding:12px 16px;font-size:12px;line-height:1.8;max-width:340px}#bar strong{color:#f5bc86}#help{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1e252cdd;padding:10px 19px;border-radius:25px;font-size:11px;color:#a8b6bf;white-space:nowrap}.tag{position:fixed;pointer-events:none;color:#fff;font-size:10px;background:#232a30d9;border:1px solid #ffffff25;border-radius:4px;padding:3px 6px;transform:translate(-50%,-100%)}a{color:#e4b58a;font-size:11px}.downloads{display:flex;gap:17px;margin-top:12px}#error{position:fixed;left:340px;top:20px;color:#ff9c83;background:#222;padding:16px;display:none}.smallbutton{padding:8px 12px;font-size:11px;margin-top:10px}#ready{display:none}@media(max-width:750px){#control{left:10px;top:10px;width:240px;max-height:85vh;padding:12px}#bar{display:none}#help{font-size:9px;max-width:95vw;white-space:normal}h1{font-size:17px}}
</style></head><body>
<canvas id="view" aria-label="복층 화재·붕괴 건물 3D 뷰어"></canvas>
<aside id="control" class="panel"><div class="eyebrow">FIRE / COLLAPSE SCENE LIBRARY</div><h1>손상된 건물, 층별로 보기</h1>
<div class="note">창문·계단·문·가구와 붕괴 형상을 가진<br>2~3층 가상 건물 10개입니다.</div>
<select id="scene" aria-label="건물 선택"></select><div class="note" id="description"></div>
<div id="levels"></div><div id="stats" class="stats"></div><hr>
<label><input id="cut" type="checkbox">벽 단면으로 내부 보기</label>
<label><input id="explode" type="checkbox">전체 보기에서 층 간격 벌리기</label>
<label><input id="roof" type="checkbox">지붕 표시</label>
<label><input id="furniture" type="checkbox" checked>가구·창틀·문 표시</label>
<label><input id="fire" type="checkbox" checked>화염 표시</label>
<label><input id="smoke" type="checkbox" checked>연기 표시</label>
<label><input id="labels" type="checkbox" checked>주요 위치 이름</label>
<label><input id="spin" type="checkbox">자동 회전</label>
<hr><div class="eyebrow">주요 구간 · 누르면 해당 위치로</div><div id="features"></div>
<button id="reset" class="smallbutton">시점 초기화</button><div class="downloads"><a id="glb">3D 모델 GLB</a><a id="metadata">장면 설정 JSON</a></div>
</aside>
<div id="bar" class="panel"><strong id="title"></strong><div id="readout"></div><div class="note">장면 원형 · 관측 복원 지도가 아닙니다<br>불·연기는 시각 표현, 고체 충돌 형상과 분리됩니다</div></div>
<div id="help">드래그: 회전　우클릭 드래그: 이동　휠: 확대　1 / 2 / 3: 층 선택　0: 전체</div>
<div id="tags"></div><div id="error"></div><div id="ready">loading</div>
<script>window.FIRE_SCENES=/*__SCENES__*/[];window.FIRE_ASSET_ROOT='__ASSET_ROOT__';</script>
<script>
'use strict';
try {
const $=id=>document.getElementById(id),library=window.FIRE_SCENES,cv=$('view'),gl=cv.getContext('webgl2',{antialias:true,alpha:false});
if(!gl)throw new Error('이 뷰어는 WebGL2 지원이 필요합니다.');
window.addEventListener('error',e=>{$('ready').textContent='error';$('error').style.display='block';$('error').textContent=e.message;});
const sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>a.map(x=>x/(Math.hypot(...a)||1));
const M={persp:(fov,asp,n,f)=>{const t=1/Math.tan(fov/2);return new Float32Array([t/asp,0,0,0,0,t,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0]);},look:(e,c)=>{const z=norm(sub(e,c)),x=norm(cross([0,0,1],z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1]);},mul:(a,b)=>{const o=new Float32Array(16);for(let r=0;r<4;r++)for(let c=0;c<4;c++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o;}};
function prog(vs,fs){const p=gl.createProgram();for(const [type,text]of [[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){const s=gl.createShader(type);gl.shaderSource(s,text);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));gl.attachShader(p,s);}gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p;}
const mesh=prog(`#version 300 es
layout(location=0)in vec3 aPos;layout(location=1)in vec3 aColor;uniform mat4 uVP;uniform float uOffset;out vec3 world;out vec3 col;out vec3 local;
void main(){local=aPos;world=aPos+vec3(0,0,uOffset);col=aColor;gl_Position=uVP*vec4(world,1);}`,
`#version 300 es
precision highp float;in vec3 world;in vec3 local;in vec3 col;out vec4 color;uniform float uClip;uniform float uFloorZ;uniform int uKind;uniform int uNFires;uniform vec3 uFires[12];uniform float uTime;
float hash(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,31.231)))*43758.5453);}
void main(){if(local.z>uClip)discard;vec3 n=normalize(cross(dFdx(world),dFdy(world)));if(!gl_FrontFacing)n=-n;float diffuse=max(dot(n,normalize(vec3(-.4,-.7,1.2))),0.);
float grain=hash(floor(local*54.));vec3 base=col*(.91+.16*grain);if(uKind==1&&abs(n.z)>.6){vec2 uv=local.xy;float seam=step(.025,fract(uv.x*1.3))*step(.025,fract(uv.y*1.3));base*=mix(.7,1.,seam);}
if(uKind==2){float mortar=step(.055,fract(local.z*5.2));base*=mix(.83,1.,mortar);base*=.93+.07*sin(local.x*2.+local.y*3.);}
vec3 lighting=vec3(.55+.43*diffuse);for(int i=0;i<12;i++){if(i>=uNFires)break;float d=length(world-uFires[i]);lighting+=vec3(1.,.30,.035)*(.6+.07*sin(uTime*8.+float(i)))/(1.+d*d);}
float depth=clamp((local.z-uFloorZ)/3.3,0.,1.);lighting*=.94+.06*depth;color=vec4(uKind==3?base*1.35:base*lighting,1);}`);
const particles=prog(`#version 300 es
layout(location=0)in vec3 aPos;layout(location=1)in vec4 aColor;layout(location=2)in float aSize;uniform mat4 uVP;uniform float uScreen;out vec4 col;
void main(){gl_Position=uVP*vec4(aPos,1);gl_PointSize=clamp(aSize*uScreen/gl_Position.w,1.,210.);col=aColor;}`,
`#version 300 es
precision highp float;in vec4 col;out vec4 color;void main(){float r=length(gl_PointCoord-.5)*2.;if(r>1.)discard;float a=exp(-r*r*3.)*(1.-smoothstep(.7,1.,r));color=vec4(col.rgb,col.a*a);}`);
const U=(p,n)=>gl.getUniformLocation(p,n),decode=(s,C)=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new C(u.buffer);};
let buffers=[],S=null,level=0,sceneIndex=0,tags=[],cam={target:[0,0,0],theta:-1.0,phi:.9,r:32},drag=null,prev=0,rendered=0;
const flags={};for(const id of ['cut','explode','roof','furniture','fire','smoke','labels','spin']){flags[id]=$(id).checked;$(id).onchange=()=>{flags[id]=$(id).checked;if(id==='explode')home();};}
const particleVao=gl.createVertexArray(),particleBuf=gl.createBuffer();gl.bindVertexArray(particleVao);gl.bindBuffer(gl.ARRAY_BUFFER,particleBuf);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,32,0);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,4,gl.FLOAT,false,32,12);gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,1,gl.FLOAT,false,32,28);
function offset(f){return flags.explode&&level<0?f*2.6:0;}
function home(){cam.target=[S.footprint_m[0]/2,S.footprint_m[1]/2,level<0?S.levels*1.3:level*3.3+.5];cam.r=Math.max(...S.footprint_m)*(level<0?1.9:1.52);cam.phi=level<0?.60:.98;cam.theta=-1.16;}
function setLevel(f){level=f;for(const b of $('levels').children)b.classList.toggle('active',+b.dataset.floor===f);home();history.replaceState(null,'',`#scene=${sceneIndex+1}&floor=${level}`);$('readout').textContent=`${S.levels}개 층 · ${S.footprint_m.join(' × ')} m · ${level<0?'전체 구조':(level+1)+'층 내부'}`;}
function load(index){sceneIndex=index;S=library[index];rendered=0;window.FIRE_VIEWER_STATUS={ready:false,scenes:library.length,scene:S.id};$('scene').value=index;for(const b of buffers){gl.deleteBuffer(b.position);gl.deleteBuffer(b.color);gl.deleteVertexArray(b.vao);}buffers=[];
for(const g of S.groups){const vao=gl.createVertexArray();gl.bindVertexArray(vao);const p=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,p);gl.bufferData(gl.ARRAY_BUFFER,decode(g.positions,Float32Array),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);const c=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,c);gl.bufferData(gl.ARRAY_BUFFER,decode(g.colors,Uint8Array),gl.STATIC_DRAW);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.UNSIGNED_BYTE,true,0,0);buffers.push({vao,position:p,color:c,...g});}
$('title').textContent=S.title;$('description').textContent=S.description;$('stats').textContent=`${S.rooms.length}개 실내 구역 · 층고 ${S.storey_height_m} m · 계단 ${S.stairs.length}개 연결`;
$('levels').replaceChildren();for(let f=-1;f<S.levels;f++){const b=document.createElement('button');b.textContent=f<0?'전체':`${f+1}층`;b.dataset.floor=f;b.onclick=()=>setLevel(f);$('levels').appendChild(b);}
$('features').replaceChildren();$('tags').replaceChildren();tags=[];for(const a of S.features){const b=document.createElement('button');b.className='feature';const span=document.createElement('span');span.textContent=`${a.floor+1}F`;b.append(span,document.createTextNode(a.label));b.onclick=()=>{if(level!==a.floor)setLevel(a.floor);cam.target=[...a.position];cam.r=9;cam.phi=.65;};$('features').appendChild(b);
if(['locked_door','fire','entry','stairs','floor_hole'].includes(a.kind)){const tag=document.createElement('div');tag.className='tag';tag.textContent=a.label;$('tags').appendChild(tag);tags.push({node:tag,feature:a});}}
$('glb').href=window.FIRE_ASSET_ROOT+'/'+S.id+'/scene.glb';$('metadata').href=window.FIRE_ASSET_ROOT+'/'+S.id+'/scene.json';$('glb').download=S.id+'.glb';$('metadata').download=S.id+'.json';setLevel(Math.min(Math.max(level,-1),S.levels-1));}
for(let i=0;i<library.length;i++){const o=document.createElement('option');o.value=i;o.textContent=library[i].title+' · '+library[i].levels+'층';$('scene').appendChild(o);}$('scene').onchange=()=>load(+$('scene').value);$('reset').onclick=home;
cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey};cv.setPointerCapture(e.pointerId);};cv.onpointerup=()=>drag=null;cv.onpointercancel=()=>drag=null;cv.oncontextmenu=e=>e.preventDefault();
cv.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.pan){const k=cam.r*.0012;cam.target[0]+=(-Math.sin(cam.theta)*dx-Math.cos(cam.theta)*dy)*k;cam.target[1]+=(Math.cos(cam.theta)*dx-Math.sin(cam.theta)*dy)*k;}else{cam.theta-=dx*.006;cam.phi=Math.max(.05,Math.min(1.53,cam.phi+dy*.006));}drag.x=e.clientX;drag.y=e.clientY;};
cv.addEventListener('wheel',e=>{e.preventDefault();cam.r=Math.max(2,Math.min(110,cam.r*Math.exp(e.deltaY*.001)));},{passive:false});
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='0')setLevel(-1);else if(['1','2','3'].includes(e.key)&&+e.key<=S.levels)setLevel(+e.key-1);});
function resize(){const d=Math.min(devicePixelRatio||1,1.7);cv.width=innerWidth*d;cv.height=innerHeight*d;gl.viewport(0,0,cv.width,cv.height);}addEventListener('resize',resize);resize();gl.enable(gl.DEPTH_TEST);gl.clearColor(.11,.14,.17,1);
function visible(f){return level<0||f===level;}
function pointData(time,smoke){
const data=[];for(const f of S.fires){if(!visible(f.floor))continue;const [x,y,z]=f.position;
const large=(S.fire_scale||1)>1,count=smoke?(large?95:55):(large?82:48);
for(let i=0;i<count;i++){const q=(i*.618033+time*(smoke?.10:.6))%1,angle=i*2.4+time*.4;
const rr=(smoke?.40+.75*q:(large?.75:.4)*(1-q))*f.radius;
const smokeHeight=f.smoke_height||2.7;
const p=[x+Math.cos(angle)*rr+(smoke?q*.35:0),y+Math.sin(angle)*rr,z+q*(smoke?smokeHeight:f.height)+offset(f.floor)+(smoke?.12:.04)];
if(f.room_bounds){const b=f.room_bounds;p[0]=Math.max(b[0]+.08,Math.min(b[2]-.08,p[0]));p[1]=Math.max(b[1]+.08,Math.min(b[3]-.08,p[1]));p[2]=Math.min(f.floor*3.3+3.02+offset(f.floor),p[2]);}
let color,size;if(smoke){color=[.19,.20,.21,(f.smoke_opacity||.13)*(1-q*.55)];size=(1.+q)*f.radius;}else{color=[1.,.24+.60*(1-q),.025,.72*(1-q*.5)];size=(.27+.5*(1-q))*f.radius;}
data.push(...p,...color,size);}}return new Float32Array(data);}

function frame(now){const time=now*.001,dt=prev?(now-prev)*.001:0;prev=now;if(flags.spin&&!drag)cam.theta+=dt*.12;
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const eye=[cam.target[0]+cam.r*Math.cos(cam.phi)*Math.cos(cam.theta),cam.target[1]+cam.r*Math.cos(cam.phi)*Math.sin(cam.theta),cam.target[2]+cam.r*Math.sin(cam.phi)];const projection=M.persp(.65,cv.width/cv.height,.1,220);projection[8]=innerWidth>750?-.15:0;const vp=M.mul(projection,M.look(eye,cam.target));
gl.useProgram(mesh);gl.uniformMatrix4fv(U(mesh,'uVP'),false,vp);gl.uniform1f(U(mesh,'uTime'),time);const firePositions=S.fires.filter(f=>visible(f.floor)).slice(0,12).flatMap(f=>[f.position[0],f.position[1],f.position[2]+offset(f.floor)+.6]);while(firePositions.length<36)firePositions.push(0);gl.uniform3fv(U(mesh,'uFires[0]'),firePositions);gl.uniform1i(U(mesh,'uNFires'),flags.fire?Math.min(12,S.fires.filter(f=>visible(f.floor)).length):0);
for(const b of buffers){if(b.kind==='fire_visual'&&!flags.fire)continue;if(b.kind==='roof'&&!flags.roof)continue;if(b.kind!=='roof'&&!visible(b.floor))continue;if(b.kind==='roof'&&level>=0&&level!==S.levels-1)continue;if(!flags.furniture&&['furniture','window','door','detail'].includes(b.kind))continue;const cut=flags.cut&&['wall','exterior','column'].includes(b.kind);gl.uniform1f(U(mesh,'uClip'),cut?b.floor*3.3+1.32:100);gl.uniform1f(U(mesh,'uFloorZ'),b.floor*3.3);gl.uniform1f(U(mesh,'uOffset'),offset(b.floor));gl.uniform1i(U(mesh,'uKind'),b.kind==='fire_visual'?3:b.kind==='slab'?1:['wall','exterior'].includes(b.kind)?2:0);gl.bindVertexArray(b.vao);gl.drawArrays(gl.TRIANGLES,0,b.count);}
gl.useProgram(particles);gl.uniformMatrix4fv(U(particles,'uVP'),false,vp);gl.uniform1f(U(particles,'uScreen'),cv.height*1.25);gl.bindVertexArray(particleVao);gl.bindBuffer(gl.ARRAY_BUFFER,particleBuf);gl.enable(gl.BLEND);gl.depthMask(false);
for(const smoke of [true,false]){if(!(smoke?flags.smoke:flags.fire))continue;const data=pointData(time,smoke);gl.bufferData(gl.ARRAY_BUFFER,data,gl.DYNAMIC_DRAW);gl.blendFunc(gl.SRC_ALPHA,smoke?gl.ONE_MINUS_SRC_ALPHA:gl.ONE);gl.drawArrays(gl.POINTS,0,data.length/8);}gl.depthMask(true);gl.disable(gl.BLEND);
for(const {node,feature:a}of tags){if(!flags.labels||!visible(a.floor)){node.style.display='none';continue;}const p=[...a.position];p[2]+=.3+offset(a.floor);const q=[0,0,0,0];for(let r=0;r<4;r++)q[r]=vp[r]*p[0]+vp[4+r]*p[1]+vp[8+r]*p[2]+vp[12+r];if(q[3]<=0){node.style.display='none';continue;}const x=(q[0]/q[3]+1)*innerWidth/2,y=(1-q[1]/q[3])*innerHeight/2;node.style.display=x<320||x>innerWidth-10||y<0||y>innerHeight?'none':'block';node.style.left=x+'px';node.style.top=y+'px';}
rendered++;if(rendered===3){const err=gl.getError();if(err)throw Error('WebGL error '+err);$('ready').textContent='ready';document.body.dataset.viewerReady='true';window.FIRE_VIEWER_STATUS={ready:true,scenes:library.length,scene:S.id,groups:buffers.length};}requestAnimationFrame(frame);}
const hash=new URLSearchParams(location.hash.slice(1));sceneIndex=Math.min(library.length-1,Math.max(0,+(hash.get('scene')||1)-1));level=hash.has('floor')?+hash.get('floor'):-1;load(sceneIndex);requestAnimationFrame(frame);
addEventListener('hashchange',()=>{const q=new URLSearchParams(location.hash.slice(1));const index=Math.min(library.length-1,Math.max(0,+(q.get('scene')||1)-1));level=q.has('floor')?+q.get('floor'):-1;if(index!==sceneIndex)load(index);else setLevel(Math.min(Math.max(level,-1),S.levels-1));});
}catch(e){document.getElementById('ready').textContent='error';document.getElementById('error').style.display='block';document.getElementById('error').textContent=e.stack||e.message;console.error(e);}
</script></body></html>
